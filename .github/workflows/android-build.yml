name: Android Build

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build and test debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4.6.1
        with:
          name: NexaMusic-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Add APK path to summary
        run: echo "APK: app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
